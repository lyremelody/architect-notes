baseURL: https://lyremelody.cn/
languageCode: zh
defaultContentLanguage: zh
title: 产研管理笔记
theme: "hugo-book"
copyright: © 2026 lyremelody.cn All Rights Reserved
privacy_policy: https://lyremelody.cn/

# Book configuration
disablePathToLower: true
enableGitInfo: true

uglyURLs: true

# Needed for mermaid/katex shortcodes
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1

menu:
  # before: []
  after:
    - name: "GitHub"
      url: "https://github.com/lyremelody/architect-notes"
      weight: 11
      pre: <img src="/svg/github-mark.svg" class="book-icon" alt="" height="20" style="vertical-align:bottom"/>
    - name: "About"
      url: "https://github.com/lyremelody/lyremelody/blob/main/README.md"
      weight: 30
      pre: <img src="/logo.png" alt="" height="20" style="vertical-align:bottom"/>

params:
  BookTheme: "light"
  BookToC: true
  BookLogo: "logo.png"
  BookSection: "*"
  BookRepo: https://github.com/lyremelody/architect-notes
  BookDateFormat: "2006-01-02"
  BookSearch: true
  BookComments: true
  BookPortableLinks: true
  BookServiceWorker: true
  plantuml:
    enable: true
    theme: "default"
    svg_image_url: "https://www.plantuml.com/plantuml/svg/"

imaging:
  resampleFilter: "CatmullRom"
  quality: 75
  anchor: Smart
